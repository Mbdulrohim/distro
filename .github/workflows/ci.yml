name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dev dependencies
        run: npm ci --ignore-scripts

      - name: Prettier check
        run: npm run format:check

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # contracts/lib/ is gitignored (see contracts/README.md) — a fresh
      # checkout has no forge-std or OpenZeppelin, so every step below fails
      # to resolve imports until these are restored.
      - name: Install contract dependencies (forge-std, OpenZeppelin)
        run: |
          forge install --no-git foundry-rs/forge-std
          forge install --no-git OpenZeppelin/openzeppelin-contracts

      - name: Forge fmt check
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        run: forge test -vvv

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Single npm-workspaces lockfile lives at the repo root — there is
          # no web/package-lock.json. Pointing this at a nonexistent file
          # makes actions/setup-node hard-fail before `npm ci` ever runs.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Must run from the repo root: `npm ci` in an npm-workspaces monorepo
        # resolves against the single root lockfile, not a per-workspace one.
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
